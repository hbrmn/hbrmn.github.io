name: Validate website
on:
  pull_request:
    branches: [master]
  push:
    branches: ["upgrade/**"]
permissions:
  contents: read
jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated pages and assets
        run: python3 scripts/check_site.py _site
